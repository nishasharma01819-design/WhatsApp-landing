<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join WhatsApp Group</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }
    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
    }
    h1 { margin: 0 0 10px; font-size: 27px; color: #222; }
    p { margin: 0 0 25px; color: #666; line-height: 1.5; }
    .join-btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: #25D366;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .join-btn:hover { background: #1ebe5d; }
    .note { margin-top: 18px; font-size: 12px; color: #999; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">✓</div>

    <h1>Join Our WhatsApp Group</h1>
    <p>Tap the button below to join the WhatsApp group.</p>

    <a id="joinButton" class="join-btn" href="#" target="_blank" rel="noopener noreferrer">
      Join WhatsApp Group
    </a>

    <div class="note">You will be redirected to WhatsApp.</div>
  </div>

  <script>
    // ==================================================
    // CHANGE ONLY THIS LINK WHENEVER YOU WANT
    // ==================================================
    const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/YOUR-GROUP-LINK";

    document.getElementById("joinButton").href = WHATSAPP_GROUP_LINK;
  </script>

</body>
</html>
