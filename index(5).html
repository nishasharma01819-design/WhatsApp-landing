<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join our WhatsApp community.">
  <title>Join WhatsApp Group</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      color: #222;
    }
    .card {
      width: min(92%, 420px);
      background: #fff;
      padding: 36px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 26px; color: #666; line-height: 1.5; }
    .join {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 10px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    .join:active { transform: scale(.99); }
    .note { margin-top: 18px; font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Join Our WhatsApp Group</h1>
    <p>Tap the button below to join our WhatsApp community.</p>

    <a id="joinButton" class="join" href="#" target="_blank" rel="noopener">
      Join WhatsApp Group
    </a>

    <div class="note">You will be taken to WhatsApp when you tap the button.</div>
  </div>

  <script>
    // =====================================================
    // CHANGE ONLY THIS LINE when you want to change groups.
    // Example:
    // const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/XXXXXXXX";
    // =====================================================
    const WHATSAPP_GROUP_LINK = "PASTE-YOUR-WHATSAPP-GROUP-LINK-HERE";

    document.getElementById("joinButton").href = WHATSAPP_GROUP_LINK;
  </script>

</body>
</html>
